name: 'Auto Author Assign'

# pull_request (not pull_request_target): GitHub restricts pull_request_target on
# public repositories. PRs from forks get a read-only token, so only PRs from
# branches in this repository are auto-assigned.
on:
  pull_request:
    types: [opened, reopened]

# The repository's default GITHUB_TOKEN is read-only, so assigning the author
# needs write access to pull requests granted explicitly.
permissions:
  pull-requests: write

jobs:
  assign-author:
    runs-on: ubuntu-latest
    steps:
      - uses: toshimaru/auto-author-assign@v3.1.0
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
