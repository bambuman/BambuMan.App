# .NET bindings read Java fields (enum constants, static constants) by name via JNI,
# which R8 can't see. Keep public/protected fields of kept classes so shrinking
# doesn't remove them (e.g. CameraX PreviewView$ImplementationMode.COMPATIBLE used by
# BarcodeScanning.Native.Maui); private fields can still be obfuscated.
-keepclassmembers class * {
    public protected <fields>;
}
